<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #06b6d4, #fbbf24);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 15px;
      box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3);
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
    }

    .brand-highlight {
      color: #06b6d4;
    }

    .brand-sub {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .welcome {
      font-size: 18px;
      color: #1f2937;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .demo-info {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #047857;
      line-height: 1.6;
    }

    .demo-info strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
      border-left: 4px solid #dc2626;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .form-input::placeholder {
      color: #d1d5db;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(30, 60, 114, 0.3);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .welcome {
        font-size: 16px;
      }

      .btn-login {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- LOGO & BRAND -->
    <div class="logo-section">
      <div class="logo">🔐</div>
      <div class="brand">PRAJAPATI<span class="brand-highlight">ERP</span></div>
      <div class="brand-sub">Enterprise Operations Suite</div>
    </div>

    <!-- WELCOME -->
    <div class="welcome">Welcome 👋</div>
    <div class="subtitle">Demo credentials use करो</div>

    <!-- DEMO INFO -->
    <div class="demo-info">
      <strong>📝 Demo Login:</strong>
      Phone: +91-8484038138<br>
      Password: admin@123
    </div>

    <!-- ERROR MESSAGE -->
    <div class="error-message" id="error-msg"></div>

    <!-- FORM -->
    <div class="form-group">
      <label class="form-label">Phone या Username</label>
      <input 
        type="text" 
        class="form-input" 
        id="username" 
        placeholder="+91-8484038138"
        value="+91-8484038138"
      >
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input 
        type="password" 
        class="form-input" 
        id="password" 
        placeholder="admin@123"
        value="admin@123"
      >
    </div>

    <!-- LOGIN BUTTON -->
    <button class="btn-login" id="login-btn" onclick="login()">
      <span id="btn-icon">🔓</span>
      <span id="btn-text">LOGIN करो</span>
    </button>
  </div>

  <script>
    // Demo credentials (hardcoded for testing)
    const DEMO_USERS = {
      '+91-8484038138': 'admin@123',
      'admin': 'prajapati@123',
      'info@prajapati.com': 'password123',
      'shivam': 'admin@123',
      '8484038138': 'admin@123'
    };

    function showError(message) {
      const el = document.getElementById('error-msg');
      el.textContent = '❌ ' + message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    function setLoading(loading) {
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnIcon = document.getElementById('btn-icon');
      
      if (loading) {
        btn.disabled = true;
        btnText.textContent = 'Loading...';
        btnIcon.innerHTML = '<span class="loading-spinner"></span>';
      } else {
        btn.disabled = false;
        btnText.textContent = 'LOGIN करो';
        btnIcon.textContent = '🔓';
      }
    }

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      console.log('🔐 Login attempt:', { username });

      // Validation
      if (!username || !password) {
        showError('Username और password दर्ज करो!');
        return;
      }

      setLoading(true);

      // Simulate server delay
      setTimeout(() => {
        // Check credentials
        if (DEMO_USERS[username] === password) {
          console.log('✅ Login successful!');

          // Create session
          const session = {
            username: username,
            role: 'admin',
            loginTime: new Date().toISOString(),
            verified: true,
            phone: '+91-8484038138'
          };

          // Save to localStorage
          localStorage.setItem('prajapati_erp_session', JSON.stringify(session));

          console.log('✅ Session created:', session);
          console.log('✅ Redirecting to dashboard...');

          // Redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          console.error('❌ Invalid credentials');
          showError('Username या password गलत है!');
          setLoading(false);
        }
      }, 500);
    }

    // Allow Enter key to submit
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        login();
      }
    });

    console.log('═══════════════════════════════════════════');
    console.log('✅ LOGIN PAGE READY');
    console.log('═══════════════════════════════════════════');
    console.log('Demo Users:', DEMO_USERS);
    console.log('═══════════════════════════════════════════');
  </script>
</body>
</html>
