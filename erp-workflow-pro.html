<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prajapati ERP Phase 3 - Professional Workflow</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="erp-professional.css"></head><body><div class="app" id="app"></div>
<script src="erp-core.js"></script>
<script>
let data = db();
const hash = () => (location.hash||'#workflow').replace('#','');
window.addEventListener('hashchange', render);
function stageClass(i, idx){ return i < idx ? 'done' : i === idx ? 'active' : 'locked'; }
function progressStages(order){ return `<div class="workflow">${STAGES.map((s,i)=>`<div class="stage ${stageClass(i, order.stageIndex)}"><b>${i < order.stageIndex?'✅':i===order.stageIndex?'🔵':'⚪'} ${s}</b><span>${i < order.stageIndex?'Completed':i===order.stageIndex?'Current stage':'Pending'}</span></div>`).join('')}</div>`; }
function layout(title, subtitle, body, active='workflow'){
  document.getElementById('app').innerHTML = `${renderSidebar(active)}<main class="main"><header class="topbar"><div class="title"><h2>${title}</h2><p>${subtitle}</p></div><div class="top-actions">${renderRoleSwitcher()}<button class="btn btn-soft" onclick="resetDemo()">Reset Demo</button><button class="btn btn-primary" onclick="exportPDF()">Export PDF</button></div></header><section class="content">${body}</section></main>`;
}
function stats(){
 const revenue=data.orders.reduce((s,o)=>s+Number(o.invoiceAmount||0),0); const expenses=data.expenses.reduce((s,e)=>s+Number(e.amount||0),0); const active=data.orders.filter(o=>o.stageIndex<8).length; const reports=data.execution.reduce((s,e)=>s+Number(e.completed||0),0);
 return `<div class="grid stats"><div class="card stat"><div class="label">Total Revenue</div><div class="value">${safeMoney(revenue)}</div><div class="hint">Hidden for non-finance roles</div></div><div class="card stat"><div class="label">Project Expenses</div><div class="value">${safeMoney(expenses)}</div><div class="hint">Admin + Accountant only</div></div><div class="card stat"><div class="label">Active Orders</div><div class="value">${active}</div><div class="hint">Live workflow tracking</div></div><div class="card stat"><div class="label">Execution Done</div><div class="value">${reports}</div><div class="hint">Photos/report ready count</div></div></div>`;
}
function orderRows(){ return data.orders.map(o=>{ const c=calcOrderCost(data,o.id); return `<tr><td><b>${o.id}</b><br><span class="pill pill-blue">${o.status}</span></td><td>${o.client}<br><small>${o.city} • ${o.service}</small></td><td>${o.qty}</td><td>${safeMoney(o.invoiceAmount)}</td><td>${safeMoney(c.total)}</td><td>${safeMoney(Number(o.invoiceAmount)-c.total)}</td><td>${o.paymentStatus}</td><td><button class="btn btn-soft" onclick="openOrder('${o.id}')">View Master</button></td></tr>`; }).join(''); }
function renderWorkflow(){
 const first=data.orders[0];
 layout('CEO Control Dashboard','Lead → Quotation → Order → Invoice → Printing → Stitching → Execution → Reporting → Payment Close', `${stats()}<br><div class="card panel"><div class="panel-head"><h3>Master Workflow Pipeline</h3><span class="pill pill-gold">Finance protected by role</span></div>${progressStages(first)}</div><br><div class="split"><div class="card panel"><div class="panel-head"><h3>Project Profitability</h3><button class="btn btn-primary" onclick="openOrder('${first.id}')">Open Order Master</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Client</th><th>Qty</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Payment</th><th>Action</th></tr></thead><tbody>${orderRows()}</tbody></table></div></div><div class="card panel client-card"><div class="panel-head"><h3>Privacy Rule</h3><span class="pill pill-red">Important</span></div><div class="notice">Operation, Printing, Stitching, Execution and Client roles cannot see client amount, payment amount, profit, internal cost or margin. Only Admin and Accountant can see finance.</div><br><h3>Today Activity</h3><div class="timeline">${data.activity.slice(0,5).map(a=>`<div class="event"><time>${a.time}</time><div><b>${a.orderId}</b><br>${a.text}</div></div>`).join('')}</div></div></div>`, 'workflow');
}
function renderOrders(){ layout('Order Master','Complete project control with finance privacy', `<div class="card panel"><div class="panel-head"><h3>All Orders</h3><button class="btn btn-primary" onclick="openNewOrder()">+ Create Order</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Client</th><th>Qty</th><th>Revenue</th><th>Internal Cost</th><th>Profit</th><th>Payment</th><th>Action</th></tr></thead><tbody>${orderRows()}</tbody></table></div></div>`, 'orders'); }
function renderOperation(){ layout('Operation Assignment','Assign printing without showing client amount/payment', `<div class="card panel"><div class="panel-head"><h3>Orders Ready For Operation</h3><button class="btn btn-primary" onclick="openAssignModal()">+ Assign Work</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Client</th><th>Work</th><th>Qty</th><th>Operation Owner</th><th>Deadline</th><th>Finance</th></tr></thead><tbody>${data.orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.client}</td><td>${o.service}</td><td>${o.qty}</td><td>${o.operationOwner}</td><td>${o.deadline}</td><td>${canSeeFinance()?safeMoney(o.invoiceAmount):'<span class="pill pill-red">Hidden</span>'}</td></tr>`).join('')}</tbody></table></div></div>`, 'operation'); }
function renderPrinting(){ layout('Printing Board','Operator sees job details, not client payment', `<div class="card panel"><div class="panel-head"><h3>Printing Jobs</h3><button class="btn btn-primary" onclick="openPrintModal()">+ Printing Entry</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Operator</th><th>Material</th><th>Artwork</th><th>Qty</th><th>Completed</th><th>Status</th><th>QC</th></tr></thead><tbody>${data.printing.map(x=>`<tr><td><b>${x.orderId}</b></td><td>${x.operator}</td><td>${x.material}</td><td>${x.artwork}</td><td>${x.qty}</td><td>${x.completed}</td><td><span class="pill pill-blue">${x.status}</span></td><td>${x.qc}</td></tr>`).join('')}</tbody></table></div></div>`, 'printing'); }
function renderStitching(){ layout('Stitching Manager','Master-wise quantity and ₹15/pc costing', `<div class="card panel"><div class="panel-head"><h3>Stitching Entries</h3><button class="btn btn-primary" onclick="openStitchModal()">+ Stitching Entry</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Manager</th><th>Master</th><th>Qty</th><th>Completed</th><th>Rate/Pc</th><th>Cost</th><th>Status</th></tr></thead><tbody>${data.stitching.map(x=>`<tr><td><b>${x.orderId}</b></td><td>${x.manager}</td><td>${x.master}</td><td>${x.qty}</td><td>${x.completed}</td><td>${safeMoney(x.rate)}</td><td>${safeMoney(Number(x.completed)*Number(x.rate))}</td><td><span class="pill pill-gold">${x.status}</span></td></tr>`).join('')}</tbody></table></div></div>`, 'stitching'); }
function renderExecution(){ layout('Execution Manager','Team-wise, work-wise, location-wise daily report', `<div class="card panel"><div class="panel-head"><h3>Execution Daily Reports</h3><button class="btn btn-primary" onclick="openExecModal()">+ Daily Report</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Manager</th><th>Team</th><th>Location</th><th>Work</th><th>Qty</th><th>Completed</th><th>Rate</th><th>Cost</th><th>Date</th></tr></thead><tbody>${data.execution.map(x=>`<tr><td><b>${x.orderId}</b></td><td>${x.manager}</td><td>${x.team}</td><td>${x.location}</td><td>${x.work}</td><td>${x.qty}</td><td>${x.completed}</td><td>${safeMoney(x.rate)}</td><td>${safeMoney(Number(x.completed)*Number(x.rate))}</td><td>${x.reportDate}</td></tr>`).join('')}</tbody></table></div></div>`, 'execution'); }
function renderExpenses(){ layout('Expenses & Team Payments','Hotel, auto, food, bus, petrol, labour and other expenses', `<div class="card panel"><div class="panel-head"><h3>Project Expenses</h3><button class="btn btn-primary" onclick="openExpenseModal()">+ Expense Entry</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Order</th><th>Team</th><th>Location</th><th>Category</th><th>Amount</th><th>Approval</th><th>Payment</th><th>Date</th></tr></thead><tbody>${data.expenses.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.orderId}</td><td>${x.team}</td><td>${x.location}</td><td>${x.category}</td><td>${safeMoney(x.amount)}</td><td><span class="pill ${x.status==='Approved'?'pill-green':'pill-gold'}">${x.status}</span></td><td>${x.paidStatus}</td><td>${x.date}</td></tr>`).join('')}</tbody></table></div><br><button class="btn btn-soft" onclick="downloadExpenseCSV()">Download Expense CSV</button></div>`, 'expenses'); }
function renderClient(){ layout('Client Progress Portal','Client sees progress only, no internal costing', `<div class="card panel client-card"><div class="panel-head"><h3>Client View: ${data.orders[0].client}</h3><span class="pill pill-blue">Public Safe View</span></div>${progressStages(data.orders[0])}<br><div class="table-wrap"><table><thead><tr><th>Order</th><th>Service</th><th>Qty</th><th>Printing</th><th>Stitching</th><th>Execution</th><th>Report</th></tr></thead><tbody>${data.orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.service}</td><td>${o.qty}</td><td>In Progress</td><td>In Progress</td><td>${o.status}</td><td><span class="pill pill-green">Photos Updating</span></td></tr>`).join('')}</tbody></table></div></div>`, 'client'); }
function renderAccounts(){ layout('Accounts & Payment Close','Accountant approves expenses, pays team, closes client payment', `<div class="card panel"><div class="panel-head"><h3>Payments</h3><button class="btn btn-primary" onclick="openPaymentModal()">+ Payment Entry</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Order</th><th>Type</th><th>Amount</th><th>Mode</th><th>Status</th><th>Date</th></tr></thead><tbody>${data.payments.map(p=>`<tr><td><b>${p.id}</b></td><td>${p.orderId}</td><td>${p.type}</td><td>${safeMoney(p.amount)}</td><td>${p.mode}</td><td>${p.status}</td><td>${p.date}</td></tr>`).join('')}</tbody></table></div></div>`, 'accounts'); }
function render(){ const h=hash(); ({workflow:renderWorkflow,orders:renderOrders,operation:renderOperation,printing:renderPrinting,stitching:renderStitching,execution:renderExecution,expenses:renderExpenses,client:renderClient,accounts:renderAccounts}[h]||renderWorkflow)(); }
function openOrder(id){ const o=data.orders.find(x=>x.id===id); const c=calcOrderCost(data,id); openModal('Order Master: '+id, `<div class="split"><div><h3>${o.client}</h3><p>${o.service} • ${o.city} • Qty ${o.qty}</p>${progressStages(o)}<br><div class="notice">Sales/Admin can track progress. Operation side will not see client payment unless role is Admin/Accountant.</div></div><div class="card panel"><h3>Finance Summary</h3><p>Revenue: <b>${safeMoney(o.invoiceAmount)}</b></p><p>Printing Cost: <b>${safeMoney(c.printing)}</b></p><p>Stitching Cost: <b>${safeMoney(c.stitching)}</b></p><p>Execution Cost: <b>${safeMoney(c.execution)}</b></p><p>Expenses: <b>${safeMoney(c.expenses)}</b></p><hr><p>Net Profit: <b>${safeMoney(Number(o.invoiceAmount)-c.total)}</b></p></div></div><br><h3>Activity Timeline</h3><div class="timeline">${data.activity.filter(a=>a.orderId===id).map(a=>`<div class="event"><time>${a.time}</time><div>${a.text}</div></div>`).join('')}</div>`); }
function input(name,label,type='text',value=''){ return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${value}"></div>`; }
function selectOrder(){ return `<div class="field"><label>Order</label><select name="orderId">${data.orders.map(o=>`<option value="${o.id}">${o.id} - ${o.client}</option>`).join('')}</select></div>`; }
function openNewOrder(){ openForm('Create New Order', `${input('client','Client Name')}${input('city','City')}${input('service','Service')}${input('qty','Quantity','number')}${input('invoiceAmount','Invoice Amount','number')}${input('deadline','Deadline','date')}`, vals=>{ vals.id=uid('PA'); vals.stageIndex=2; vals.status='Order'; vals.paymentStatus='Pending'; vals.createdAt=today(); vals.salesOwner='Current User'; vals.operationOwner='Ravi Kumar'; data.orders.unshift(vals); addActivity(data, vals.id, 'New order created'); saveDB(data); render(); }); }
function openAssignModal(){ openForm('Assign Operation Work', `${selectOrder()}${input('operationOwner','Operation Owner','text','Ravi Kumar')}${input('deadline','Deadline','date',today())}`, vals=>{ const o=data.orders.find(x=>x.id===vals.orderId); o.operationOwner=vals.operationOwner; o.deadline=vals.deadline; o.stageIndex=Math.max(o.stageIndex,3); o.status='Operation Assigned'; addActivity(data,o.id,'Operation assignment updated'); saveDB(data); render(); }); }
function openPrintModal(){ openForm('Printing Entry', `${selectOrder()}${input('operator','Operator','text','Vivek Kumar')}${input('material','Material','text','600 GSM Rexin')}${input('qty','Quantity','number')}${input('completed','Completed','number')}`, vals=>{ vals.status='In Progress'; vals.qc='Pending'; vals.artwork='Approved'; data.printing.unshift(vals); const o=data.orders.find(x=>x.id===vals.orderId); o.stageIndex=Math.max(o.stageIndex,4); o.status='Printing'; addActivity(data,o.id,'Printing entry added'); saveDB(data); render(); }); }
function openStitchModal(){ openForm('Stitching Entry', `${selectOrder()}${input('manager','Manager','text','Rekha Prajapati')}${input('master','Master Name','text','Md Dulare')}${input('qty','Quantity','number')}${input('completed','Completed','number')}${input('rate','Rate Per Pc','number','15')}`, vals=>{ vals.status='In Progress'; vals.qc='Pending'; data.stitching.unshift(vals); const o=data.orders.find(x=>x.id===vals.orderId); o.stageIndex=Math.max(o.stageIndex,5); o.status='Stitching'; addActivity(data,o.id,'Stitching entry added'); saveDB(data); render(); }); }
function openExecModal(){ openForm('Execution Daily Report', `${selectOrder()}${input('manager','Manager','text','Ravi Kumar')}${input('team','Team','text','Team A')}${input('location','Location')}${input('work','Work Type','text','Hood Fitting')}${input('qty','Planned Qty','number')}${input('completed','Completed Qty','number')}${input('rate','Rate','number','90')}`, vals=>{ vals.status='In Progress'; vals.reportDate=today(); data.execution.unshift(vals); const o=data.orders.find(x=>x.id===vals.orderId); o.stageIndex=Math.max(o.stageIndex,6); o.status='Execution'; addActivity(data,o.id,'Execution daily report submitted'); saveDB(data); render(); }); }
function openExpenseModal(){ openForm('Expense Entry', `${selectOrder()}${input('team','Team','text','Team A')}${input('location','Location')}${input('category','Category','text','Food')}${input('amount','Amount','number')}`, vals=>{ vals.id=uid('EXP'); vals.status='Pending'; vals.paidStatus='Unpaid'; vals.date=today(); data.expenses.unshift(vals); addActivity(data,vals.orderId,`Expense added: ${vals.category}`); saveDB(data); render(); }); }
function openPaymentModal(){ openForm('Payment Entry', `${selectOrder()}${input('type','Type','text','Client Receipt')}${input('amount','Amount','number')}${input('mode','Mode','text','Bank')}${input('status','Status','text','Received')}`, vals=>{ vals.id=uid('PAY'); vals.date=today(); data.payments.unshift(vals); addActivity(data,vals.orderId,`Payment entry: ${vals.type}`); saveDB(data); render(); }); }
function openForm(title, fields, onSave){ openModal(title, `<form id="modalForm"><div class="form-grid">${fields}</div></form>`, ()=>{ const form=document.getElementById('modalForm'); const vals=Object.fromEntries(new FormData(form).entries()); onSave(vals); closeModal(); toast('Saved successfully'); }); }
function openModal(title, body, onSave=null){ const old=document.getElementById('modal'); if(old) old.remove(); document.body.insertAdjacentHTML('beforeend', `<div class="modal active" id="modal"><div class="modal-card"><div class="modal-head"><h3>${title}</h3><button class="btn btn-danger" onclick="closeModal()">Close</button></div><div class="modal-body">${body}</div><div class="modal-foot">${onSave?'<button class="btn btn-primary" id="saveModal">Save</button>':''}</div></div></div>`); if(onSave) document.getElementById('saveModal').onclick=onSave; }
function closeModal(){ document.getElementById('modal')?.remove(); }
function downloadExpenseCSV(){ csvDownload('prajapati-project-expenses.csv', [['ID','Order','Team','Location','Category','Amount','Approval','Payment','Date'], ...data.expenses.map(e=>[e.id,e.orderId,e.team,e.location,e.category,e.amount,e.status,e.paidStatus,e.date])]); }
render();
</script></body></html>
