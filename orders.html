<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --cyan: #06b6d4; --gold: #fbbf24; --dark: #0f172a; --light: #f0f9ff; --border: #e0f2fe; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--light); }
    .container { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--dark); color: white; padding: 20px; position: fixed; height: 100vh; overflow-y: auto; }
    .sidebar-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--cyan), var(--gold)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .sidebar-menu { list-style: none; }
    .sidebar-menu li { margin-bottom: 10px; }
    .sidebar-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 14px; }
    .sidebar-menu a:hover, .sidebar-menu a.active { background: rgba(6,182,212,0.2); color: var(--cyan); }
    .main { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 20px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    .topbar-title { font-size: 24px; font-weight: 700; color: var(--cyan); }
    .logout-btn { background: var(--cyan); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
    .logout-btn:hover { background: #0891b2; }
    .content { padding: 30px; flex: 1; overflow-y: auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .page-header h1 { font-size: 28px; color: var(--dark); }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), #0891b2); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(6,182,212,0.3); }
    .filters { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .filter-group { display: flex; gap: 10px; align-items: center; }
    .filter-group label { font-size: 13px; font-weight: 600; color: #6b7280; }
    .filter-group input, .filter-group select { padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px; font-family: inherit; }
    .table-container { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #f9fafb; border-bottom: 2px solid var(--border); }
    th { padding: 15px; text-align: left; font-weight: 600; font-size: 13px; color: #6b7280; text-transform: uppercase; }
    td { padding: 15px; border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: #f9fafb; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-processing { background: #dbeafe; color: #1e40af; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-header { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--dark); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #374151; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6,182,212,0.1); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; }
    .btn-cancel { background: #f3f4f6; color: #1f2937; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-small { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-edit { background: var(--cyan); color: white; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">📦</div>
        <div style="font-size: 16px; font-weight: 700;">PRAJAPATI</div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="orders.html" class="active">📋 Orders</a></li>
        <li><a href="leads.html">🎯 Leads</a></li>
        <li><a href="quotations.html">📝 Quotations</a></li>
        <li><a href="invoices.html">💰 Invoices</a></li>
        <li><a href="#coming">👥 Customers</a></li>
        <li><a href="#coming">🖨️ Printing</a></li>
        <li><a href="#coming">✂️ Stitching</a></li>
        <li><a href="#coming">🎬 Execution</a></li>
        <li><a href="#coming">🚚 Dispatch</a></li>
        <li><a href="#coming">👨‍💼 Team</a></li>
        <li><a href="#coming">⚙️ Settings</a></li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-title">Orders</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="content">
        <div class="page-header">
          <h1>📋 Order Management</h1>
          <button class="btn-primary" onclick="openModal()">+ New Order</button>
        </div>

        <div class="filters">
          <div class="filter-group">
            <label>Search:</label>
            <input type="text" id="searchInput" placeholder="Order ID or Customer" onkeyup="filterOrders()">
          </div>
          <div class="filter-group">
            <label>Status:</label>
            <select id="statusFilter" onchange="filterOrders()">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="processing">Processing</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">Create New Order</div>
      <form id="orderForm">
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" id="custName" required>
        </div>
        <div class="form-group">
          <label>Customer Phone</label>
          <input type="tel" id="custPhone" required>
        </div>
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="custAmount" min="0" step="100" required>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="custStatus" required>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Order</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let orders = [
      { id: 'ORD-001', name: 'Amit Kumar', amount: 25000, status: 'completed', date: '2026-05-15' },
      { id: 'ORD-002', name: 'Priya Singh', amount: 15000, status: 'processing', date: '2026-05-18' },
      { id: 'ORD-003', name: 'Rajesh Patel', amount: 8500, status: 'pending', date: '2026-05-19' },
      { id: 'ORD-004', name: 'Neha Gupta', amount: 32000, status: 'processing', date: '2026-05-18' },
      { id: 'ORD-005', name: 'Vikram Singh', amount: 12000, status: 'pending', date: '2026-05-19' },
    ];

    window.addEventListener('load', () => {
      const session = localStorage.getItem('prajapati_erp_session');
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      displayOrders(orders);
    });

    function displayOrders(data) {
      const tbody = document.getElementById('ordersBody');
      tbody.innerHTML = data.map(order => `
        <tr>
          <td><strong>${order.id}</strong></td>
          <td>${order.name}</td>
          <td><strong>₹${order.amount.toLocaleString()}</strong></td>
          <td><span class="status-badge status-${order.status}">${order.status}</span></td>
          <td>${new Date(order.date).toLocaleDateString('en-IN')}</td>
          <td><button class="btn-small btn-edit" onclick="alert('Viewing Order')">View</button></td>
        </tr>
      `).join('');
    }

    function filterOrders() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const filtered = orders.filter(o => {
        const matchSearch = o.id.toLowerCase().includes(search) || o.name.toLowerCase().includes(search);
        const matchStatus = !status || o.status === status;
        return matchSearch && matchStatus;
      });
      displayOrders(filtered);
    }

    function openModal() {
      document.getElementById('orderModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('orderModal').classList.remove('active');
    }

    function logout() {
      localStorage.removeItem('prajapati_erp_session');
      window.location.href = 'login.html';
    }

    document.getElementById('orderForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Order created successfully!');
      closeModal();
      document.getElementById('orderForm').reset();
    });

    document.getElementById('orderModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('orderModal')) closeModal();
    });
  </script>
</body>
</html>
