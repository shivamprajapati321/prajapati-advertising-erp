<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard · Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f9ff;
      color: #1f2937;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR - MODERN CYAN & GOLD */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: white;
      padding: 24px 16px;
      overflow-y: auto;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      z-index: 100;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
    }

    .sidebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(251, 191, 36, 0.05) 100%);
      pointer-events: none;
    }

    /* Sidebar sections */
    .sidebar-section {
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 800;
      color: #06b6d4;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-section-title::before {
      content: '';
      width: 3px;
      height: 3px;
      background: #fbbf24;
      border-radius: 50%;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .sidebar-link::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #06b6d4, #fbbf24);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.25s ease-out;
    }

    .sidebar-link:hover {
      background: rgba(6, 182, 212, 0.15);
      color: #06b6d4;
    }

    .sidebar-link:hover::before {
      transform: scaleY(1);
    }

    .sidebar-link.active {
      background: rgba(6, 182, 212, 0.2);
      color: #06b6d4;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(6, 182, 212, 0.2);
      position: relative;
      z-index: 2;
    }

    .sidebar-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #06b6d4, #fbbf24);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .sidebar-logo-text {
      font-size: 13px;
      font-weight: 800;
      color: white;
    }

    .sidebar-logo-sub {
      font-size: 10px;
      color: #06b6d4;
      font-weight: 700;
    }

    .sidebar-footer {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(6, 182, 212, 0.2);
    }

    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sidebar-user-avatar {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #06b6d4, #fbbf24);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
    }

    .sidebar-user-name {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 700;
    }

    .sidebar-logout {
      width: 100%;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-logout:hover {
      background: rgba(239, 68, 68, 0.3);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .main {
      flex: 1;
      margin-left: 260px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: white;
      padding: 16px 28px;
      border-bottom: 2px solid #e0f2fe;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.08);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-left {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .topbar-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .page {
      flex: 1;
      padding: 32px 40px;
      overflow-y: auto;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* HERO SECTION - CYAN GRADIENT */
    .hero {
      background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #0891b2 100%);
      border-radius: 18px;
      padding: 40px;
      color: white;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(6, 182, 212, 0.2);
      animation: slideUp 0.5s ease-out;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-left {
      flex: 1;
    }

    .hero-greeting {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.9;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .hero-name {
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .hero-meta {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 600;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-icon {
      font-size: 80px;
      opacity: 0.2;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* STATS GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 32px;
      animation: slideUp 0.6s ease-out 0.1s both;
    }

    .stat-block {
      background: white;
      border: 2px solid #e0f2fe;
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .stat-block::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #06b6d4, #fbbf24);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease-out;
    }

    .stat-block:hover {
      border-color: #06b6d4;
      box-shadow: 0 12px 32px rgba(6, 182, 212, 0.15);
      transform: translateY(-6px);
    }

    .stat-block:hover::before {
      transform: scaleX(1);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 800;
      color: #0891b2;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #06b6d4, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      line-height: 1;
    }

    .stat-sub {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 600;
    }

    /* SECTIONS */
    .section {
      background: white;
      border: 2px solid #e0f2fe;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      animation: slideUp 0.6s ease-out 0.2s both;
      transition: all 0.3s ease-out;
    }

    .section:hover {
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.1);
      border-color: #06b6d4;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f0f9ff;
    }

    .section-head h3 {
      font-size: 15px;
      font-weight: 800;
      color: #0891b2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0;
    }

    .section-head-sub {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 700;
    }

    /* MODULE GRID */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mod-card {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      border: 2px solid #bae6fd;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
      animation: scaleIn 0.4s ease-out;
    }

    .mod-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(251, 191, 36, 0.08) 100%);
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }

    .mod-card:hover {
      transform: translateY(-8px);
      border-color: #06b6d4;
      box-shadow: 0 16px 40px rgba(6, 182, 212, 0.2);
      background: linear-gradient(135deg, #e0f2fe 0%, #cffafe 100%);
    }

    .mod-card:hover::before {
      opacity: 1;
    }

    .mc-icon {
      font-size: 36px;
      line-height: 1;
      position: relative;
      z-index: 1;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .mod-card:hover .mc-icon {
      animation: none;
      transform: scale(1.15) rotate(5deg);
    }

    .mc-label {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      position: relative;
      z-index: 1;
    }

    .mc-sub {
      font-size: 12px;
      color: #0891b2;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    /* SCROLLBAR */
    .page::-webkit-scrollbar {
      width: 8px;
    }

    .page::-webkit-scrollbar-track {
      background: #f0f9ff;
    }

    .page::-webkit-scrollbar-thumb {
      background: #06b6d4;
      border-radius: 4px;
    }

    .page::-webkit-scrollbar-thumb:hover {
      background: #0891b2;
    }

    /* RESPONSIVE */
    @media (max-width: 1200px) {
      .stats-grid,
      .module-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 70px;
        padding: 12px 8px;
      }

      .main {
        margin-left: 70px;
      }

      .page {
        padding: 20px;
      }

      .hero {
        padding: 24px;
      }

      .hero-name {
        font-size: 28px;
      }

      .stats-grid,
      .module-grid {
        grid-template-columns: 1fr;
      }

      .sidebar-logo-text,
      .sidebar-section-title,
      .sidebar-link {
        font-size: 10px;
      }
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📦</div>
      <div>
        <div class="sidebar-logo-text">PRAJAPATI</div>
        <div class="sidebar-logo-sub">ERP</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">MAIN</div>
      <a href="dashboard.html" class="sidebar-link active">📊 Dashboard</a>
      <a href="orders.html" class="sidebar-link">📋 Orders</a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">SALES</div>
      <a href="leads.html" class="sidebar-link">🎯 Leads CRM</a>
      <a href="customers.html" class="sidebar-link">👥 Customers</a>
      <a href="quotations.html" class="sidebar-link">📝 Quotations</a>
      <a href="invoices.html" class="sidebar-link">🧾 Invoices</a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">OPERATIONS</div>
      <a href="printing.html" class="sidebar-link">🖨️ Printing</a>
      <a href="stitching.html" class="sidebar-link">✂️ Stitching</a>
      <a href="execution.html" class="sidebar-link">🛺 Execution</a>
      <a href="dispatch.html" class="sidebar-link">🚚 Dispatch</a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">FINANCE</div>
      <a href="reports.html" class="sidebar-link">📊 Reports</a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">ADMIN</div>
      <a href="team.html" class="sidebar-link">👥 Team</a>
      <a href="settings.html" class="sidebar-link">⚙️ Settings</a>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">S</div>
        <div class="sidebar-user-name">Shivam<br>8484038138</div>
      </div>
      <button class="sidebar-logout" onclick="AUTH.logout()">🚪 Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h2 style="font-size:18px;color:#0891b2;margin:0">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <span style="font-size:12px;color:#9ca3af">📅 Monday, 18 May 2026</span>
      </div>
    </header>

    <div class="page" id="dashboard-page">
      <div style="text-align:center;padding:60px;color:#9ca3af">Loading dashboard...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib-config.js"></script>
<script src="lib-auth.js"></script>

<script>
(async function() {
  try {
    const session = AUTH.requireLogin();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const container = document.getElementById('dashboard-page');
    const role = session.role || 'staff';
    const userName = session.name || 'User';
    const today = new Date().toLocaleDateString('en-IN', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });

    let html = `
      <div class="hero">
        <div class="hero-content">
          <div class="hero-left">
            <div class="hero-greeting">Welcome back 👋</div>
            <div class="hero-name">${userName}</div>
            <div class="hero-meta">
              <span>📅 ${today}</span>
              <span>•</span>
              <span>Role: <strong>${role}</strong></span>
            </div>
          </div>
          <div class="hero-icon">🚀</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-block">
          <div class="stat-label">📊 System Status</div>
          <div class="stat-value">✅</div>
          <div class="stat-sub">All modules online</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">👥 Active Users</div>
          <div class="stat-value">38</div>
          <div class="stat-sub">Connected now</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">📦 Pending Orders</div>
          <div class="stat-value">12</div>
          <div class="stat-sub">In production</div>
        </div>
        <div class="stat-block">
          <div class="stat-label">💰 Today's Revenue</div>
          <div class="stat-value">₹2.4L</div>
          <div class="stat-sub">On track</div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>📦 Available Modules</h3>
          <span class="section-head-sub">8 modules</span>
        </div>
        <div class="module-grid">
          <a href="orders.html" class="mod-card">
            <div class="mc-icon">📋</div>
            <div class="mc-label">Orders</div>
            <div class="mc-sub">Multi-location</div>
          </a>
          <a href="execution.html" class="mod-card">
            <div class="mc-icon">🛺</div>
            <div class="mc-label">Execution</div>
            <div class="mc-sub">Field tracking</div>
          </a>
          <a href="printing.html" class="mod-card">
            <div class="mc-icon">🖨️</div>
            <div class="mc-label">Printing</div>
            <div class="mc-sub">Job tracking</div>
          </a>
          <a href="stitching.html" class="mod-card">
            <div class="mc-icon">✂️</div>
            <div class="mc-label">Stitching</div>
            <div class="mc-sub">Quality control</div>
          </a>
          <a href="dispatch.html" class="mod-card">
            <div class="mc-icon">🚚</div>
            <div class="mc-label">Dispatch</div>
            <div class="mc-sub">Logistics</div>
          </a>
          <a href="leads.html" class="mod-card">
            <div class="mc-icon">🎯</div>
            <div class="mc-label">Leads</div>
            <div class="mc-sub">CRM pipeline</div>
          </a>
          <a href="quotations.html" class="mod-card">
            <div class="mc-icon">📝</div>
            <div class="mc-label">Quotations</div>
            <div class="mc-sub">Estimates</div>
          </a>
          <a href="invoices.html" class="mod-card">
            <div class="mc-icon">🧾</div>
            <div class="mc-label">Invoices</div>
            <div class="mc-sub">Tax invoices</div>
          </a>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>🔧 Admin Tools</h3>
          <span class="section-head-sub">4 tools</span>
        </div>
        <div class="module-grid">
          <a href="team.html" class="mod-card">
            <div class="mc-icon">👥</div>
            <div class="mc-label">Team</div>
            <div class="mc-sub">Staff management</div>
          </a>
          <a href="settings.html" class="mod-card">
            <div class="mc-icon">⚙️</div>
            <div class="mc-label">Settings</div>
            <div class="mc-sub">Configuration</div>
          </a>
          <a href="reports.html" class="mod-card">
            <div class="mc-icon">📊</div>
            <div class="mc-label">Reports</div>
            <div class="mc-sub">Analytics</div>
          </a>
          <a href="hr.html" class="mod-card">
            <div class="mc-icon">💼</div>
            <div class="mc-label">HR</div>
            <div class="mc-sub">Human resources</div>
          </a>
        </div>
      </div>
    `;

    container.innerHTML = html;

    const statBlocks = container.querySelectorAll('.stat-block');
    statBlocks.forEach((block, index) => {
      block.style.animation = `slideUp 0.6s ease-out ${0.15 + index * 0.05}s both`;
    });

    const modCards = container.querySelectorAll('.mod-card');
    modCards.forEach((card, index) => {
      card.style.animationDelay = `${0.3 + index * 0.06}s`;
    });

  } catch (error) {
    console.error(error);
    document.getElementById('dashboard-page').innerHTML = `
      <div class="hero"><div class="hero-name">Dashboard</div></div>
      <div class="section" style="text-align:center;padding:40px;color:#dc2626">
        ⚠️ Error: ${error.message}
      </div>
    `;
  }
})();
</script>

</body>
</html>
