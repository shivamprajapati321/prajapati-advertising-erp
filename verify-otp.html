<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .verify-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #06b6d4, #fbbf24);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 15px;
      box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3);
    }

    .welcome {
      font-size: 18px;
      color: #1f2937;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 25px;
      text-align: center;
    }

    .error-message, .success-message {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
      border-left: 4px solid;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      border-left-color: #dc2626;
    }

    .success-message {
      background: #d1fae5;
      color: #059669;
      border-left-color: #10b981;
    }

    .error-message.show, .success-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      transition: all 0.3s ease;
      text-align: center;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .form-input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .btn-verify {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
    }

    .btn-verify:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(30, 60, 114, 0.3);
    }

    .btn-verify:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .timer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #9ca3af;
    }

    .timer.warning {
      color: #d97706;
    }

    .resend-btn {
      background: none;
      border: none;
      color: #06b6d4;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .resend-btn:hover {
      text-decoration: underline;
    }

    .resend-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #06b6d4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .verify-container {
        padding: 30px 20px;
      }

      .welcome {
        font-size: 16px;
      }

      .btn-verify {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <!-- LOGO & BRAND -->
    <div class="logo-section">
      <div class="logo">✓</div>
    </div>

    <!-- WELCOME -->
    <div class="welcome">OTP भेज दिया गया</div>
    <div class="subtitle" id="phone-display">WhatsApp पर OTP चेक करो</div>

    <!-- ERROR & SUCCESS -->
    <div class="error-message" id="error-msg"></div>
    <div class="success-message" id="success-msg">✅ Login सफल!</div>

    <!-- OTP INPUT -->
    <div class="form-group">
      <label class="form-label">OTP दर्ज करो</label>
      <input 
        type="text" 
        class="form-input" 
        id="otp-input" 
        placeholder="000000"
        maxlength="6"
        inputmode="numeric"
      >
    </div>

    <!-- VERIFY BUTTON -->
    <button class="btn-verify" id="verify-btn" onclick="verifyOTP()">
      <span id="btn-text">VERIFY OTP</span>
    </button>

    <!-- TIMER -->
    <div class="timer" id="timer">
      <span id="timer-text">2 मिनट में expire होगा</span><br>
      OTP नहीं मिला? 
      <button class="resend-btn" id="resend-btn" onclick="resendOTP()">फिर से भेजो</button>
    </div>

    <!-- BACK LINK -->
    <div class="back-link">
      <a href="login.html">← वापस जाओ</a>
    </div>
  </div>

  <script>
    // CONFIG
    const CONFIG = {
      SUPABASE_URL: 'https://shafygjbffffjhwhmcgo.supabase.co',
      SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYWZ5Z2piZmZmZmpod2htY2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDc2MjAsImV4cCI6MjA5MzQ4MzYyMH0.sygn9BEjfdht2HFdclSDnn7H5GeYqHnmPXuEnDVIafE',
      SESSION_KEY: 'prajapati_erp_session'
    };

    const supabaseClient = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );

    let otpCode = '';
    let userPhone = '';
    let resendCount = 0;
    let timerInterval = null;
    let timeLeft = 120; // 2 minutes

    // Get phone from URL parameter
    function getPhoneFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('phone') || '';
    }

    // Initialize
    function init() {
      userPhone = getPhoneFromURL() || sessionStorage.getItem('otp_phone');
      otpCode = sessionStorage.getItem('otp_code') || '';
      
      if (!userPhone) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('phone-display').textContent = `OTP भेज दिया गया ${userPhone} पर`;
      
      startTimer();
      
      // Auto-focus OTP input
      document.getElementById('otp-input').focus();
      
      console.log('✅ OTP Page Ready');
      console.log('📱 Phone:', userPhone);
    }

    // Timer
    function startTimer() {
      timeLeft = 120;
      timerInterval = setInterval(() => {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        
        const timerEl = document.getElementById('timer-text');
        timerEl.textContent = `${minutes}m ${seconds}s में expire होगा`;
        
        if (timeLeft < 30) {
          document.getElementById('timer').classList.add('warning');
        }
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerEl.textContent = 'OTP expire हो गया!';
          document.getElementById('verify-btn').disabled = true;
          document.getElementById('otp-input').disabled = true;
        }
      }, 1000);
    }

    // Verify OTP
    function verifyOTP() {
      const enteredOTP = document.getElementById('otp-input').value.trim();

      if (!enteredOTP) {
        showError('OTP दर्ज करो!');
        return;
      }

      if (enteredOTP.length !== 6) {
        showError('OTP 6 अंकों का होना चाहिए!');
        return;
      }

      const verifyBtn = document.getElementById('verify-btn');
      verifyBtn.disabled = true;

      // Simulate OTP verification (Demo)
      setTimeout(() => {
        if (enteredOTP === otpCode) {
          showSuccess('✅ OTP verified! Redirecting...');
          
          // Create session
          const session = {
            phone: userPhone,
            role: 'admin',
            loginTime: new Date().toISOString(),
            verified: true
          };
          
          localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(session));
          
          clearInterval(timerInterval);
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          showError('❌ OTP गलत है!');
          document.getElementById('otp-input').value = '';
          document.getElementById('otp-input').focus();
          verifyBtn.disabled = false;
        }
      }, 500);
    }

    // Resend OTP
    function resendOTP() {
      resendCount++;
      if (resendCount >= 3) {
        showError('बहुत ज्यादा attempt किए। बाद में कोशिश करो!');
        return;
      }

      showSuccess('✅ नया OTP भेज दिया गया!');
      
      // Reset timer
      clearInterval(timerInterval);
      document.getElementById('timer').classList.remove('warning');
      document.getElementById('otp-input').value = '';
      document.getElementById('otp-input').focus();
      
      startTimer();
    }

    function showError(message) {
      const errorEl = document.getElementById('error-msg');
      errorEl.textContent = message;
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 4000);
    }

    function showSuccess(message) {
      const successEl = document.getElementById('success-msg');
      successEl.textContent = message;
      successEl.classList.add('show');
    }

    // Allow Enter key to verify
    document.getElementById('otp-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        verifyOTP();
      }
    });

    // Only allow numbers
    document.getElementById('otp-input').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    // Initialize on load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
