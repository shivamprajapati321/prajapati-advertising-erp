<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); max-width: 450px; width: 100%; }
    .header { text-align: center; margin-bottom: 30px; }
    .logo { width: 60px; height: 60px; background: linear-gradient(135deg, #06b6d4, #fbbf24); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 15px; box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3); }
    .brand { font-size: 24px; font-weight: 700; color: #1f2937; }
    .brand-highlight { color: #06b6d4; }
    .subtitle { font-size: 14px; color: #9ca3af; margin-top: 10px; }
    .error-message { background: #fee2e2; color: #991b1b; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 13px; border-left: 4px solid #dc2626; }
    .error-message.show { display: block; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #374151; font-size: 14px; }
    input { width: 100%; padding: 12px 15px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; transition: all 0.3s ease; }
    input:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1); }
    input::placeholder { color: #d1d5db; }
    button { width: 100%; padding: 12px; background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-size: 15px; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(30, 60, 114, 0.3); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .demo-info { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; color: #047857; line-height: 1.6; }
    .demo-info strong { display: block; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="header">
      <div class="logo">🔐</div>
      <div class="brand">PRAJAPATI<span class="brand-highlight">ERP</span></div>
      <div class="subtitle">Enterprise Operations Suite</div>
    </div>

    <div class="error-message" id="error"></div>

    <div class="demo-info">
      <strong>📝 Demo Credentials:</strong>
      Phone: +91-8484038138<br>
      Password: admin@123
    </div>

    <div class="form-group">
      <label>Phone or Username</label>
      <input type="text" id="username" placeholder="+91-8484038138 या admin" value="+91-8484038138">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" value="admin@123">
    </div>

    <button id="loginBtn" onclick="login()">LOGIN</button>
  </div>

  <script>
    const DEMO_USERS = {
      '+91-8484038138': 'admin@123',
      'admin': 'prajapati@123',
      'info@prajapati.com': 'password123'
    };

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = '❌ ' + msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        showError('Please enter both username and password');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      setTimeout(() => {
        if (DEMO_USERS[username] === password) {
          const session = {
            username: username,
            role: 'admin',
            loginTime: new Date().toISOString(),
            verified: true
          };

          localStorage.setItem('prajapati_erp_session', JSON.stringify(session));
          console.log('✅ Login successful');
          window.location.href = 'dashboard.html';
        } else {
          showError('Invalid username or password');
          btn.disabled = false;
          btn.textContent = 'LOGIN';
        }
      }, 500);
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    window.addEventListener('load', () => {
      if (localStorage.getItem('prajapati_erp_session')) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
