<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #06b6d4, #fbbf24);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 15px;
      box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3);
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
    }

    .brand-highlight {
      color: #06b6d4;
    }

    .brand-sub {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .welcome {
      font-size: 18px;
      color: #1f2937;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
      border-left: 4px solid #dc2626;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .form-input::placeholder {
      color: #d1d5db;
    }

    .btn-send {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-send:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(30, 60, 114, 0.3);
    }

    .btn-send:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-icon {
      font-size: 16px;
    }

    .help-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
    }

    .help-link {
      color: #06b6d4;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .help-link:hover {
      text-decoration: underline;
    }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-message {
      background: #d1fae5;
      color: #059669;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
      border-left: 4px solid #10b981;
    }

    .success-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .welcome {
        font-size: 16px;
      }

      .btn-send {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- LOGO & BRAND -->
    <div class="logo-section">
      <div class="logo">📦</div>
      <div class="brand">PRAJAPATI<span class="brand-highlight">ERP</span></div>
      <div class="brand-sub">Enterprise Operations Suite</div>
    </div>

    <!-- WELCOME -->
    <div class="welcome">Welcome back 👋</div>
    <div class="subtitle">WhatsApp number डालो, OTP भेजेंगे</div>

    <!-- ERROR MESSAGE -->
    <div class="error-message" id="error-msg"></div>
    <div class="success-message" id="success-msg">✅ OTP भेज दिया गया! Check WhatsApp</div>

    <!-- FORM -->
    <div class="form-group">
      <label class="form-label">WhatsApp Number</label>
      <input 
        type="tel" 
        class="form-input" 
        id="phone-input" 
        placeholder="+91-8484038138"
        value="+91-8484038138"
      >
    </div>

    <!-- SEND OTP BUTTON -->
    <button class="btn-send" id="send-btn" onclick="sendOTP()">
      <span class="btn-icon" id="btn-icon">📱</span>
      <span id="btn-text">SEND OTP</span>
    </button>

    <!-- HELP -->
    <div class="help-text">
      समस्या? <span class="help-link" onclick="contactAdmin()">Contact admin</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ════════════════════════════════════════════════════════════════
    // CONFIG - Supabase Configuration
    // ════════════════════════════════════════════════════════════════
    
    const CONFIG = {
      SUPABASE_URL: 'https://shafygjbffffjhwhmcgo.supabase.co',
      SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYWZ5Z2piZmZmZmpod2htY2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDc2MjAsImV4cCI6MjA5MzQ4MzYyMH0.sygn9BEjfdht2HFdclSDnn7H5GeYqHnmPXuEnDVIafE',
      WATI_URL: 'https://live-mt-server.wati.io/1077226',
      SESSION_KEY: 'prajapati_erp_session'
    };

    // Initialize Supabase
    const supabaseClient = window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );

    // ════════════════════════════════════════════════════════════════
    // HELPER FUNCTIONS
    // ════════════════════════════════════════════════════════════════

    function showError(message) {
      const errorEl = document.getElementById('error-msg');
      errorEl.textContent = '❌ ' + message;
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
      const successEl = document.getElementById('success-msg');
      successEl.textContent = '✅ ' + message;
      successEl.classList.add('show');
      setTimeout(() => successEl.classList.remove('show'), 5000);
    }

    function setLoading(loading) {
      const btn = document.getElementById('send-btn');
      const btnText = document.getElementById('btn-text');
      const btnIcon = document.getElementById('btn-icon');
      
      if (loading) {
        btn.disabled = true;
        btnText.textContent = 'Sending...';
        btnIcon.innerHTML = '<span class="loading-spinner"></span>';
      } else {
        btn.disabled = false;
        btnText.textContent = 'SEND OTP';
        btnIcon.textContent = '📱';
      }
    }

    // ════════════════════════════════════════════════════════════════
    // SEND OTP FUNCTION
    // ════════════════════════════════════════════════════════════════

    async function sendOTP() {
      const phone = document.getElementById('phone-input').value.trim();

      // Validation
      if (!phone) {
        showError('Phone number दर्ज करो!');
        return;
      }

      if (phone.length < 10) {
        showError('Valid phone number दर्ज करो!');
        return;
      }

      setLoading(true);

      try {
        // Simulate OTP send via Wati (Mock)
        console.log('📱 OTP भेज रहे हैं...', phone);

        // For demo: Auto-generate OTP
        const otp = Math.floor(100000 + Math.random() * 900000);
        
        // Store OTP temporarily
        sessionStorage.setItem('otp_phone', phone);
        sessionStorage.setItem('otp_code', otp);
        sessionStorage.setItem('otp_timestamp', Date.now());

        console.log('✅ OTP Generated (Demo):', otp);
        console.log('📱 Phone:', phone);

        showSuccess('OTP भेज दिया गया! Check WhatsApp');

        // Redirect to OTP verification page after 2 seconds
        setTimeout(() => {
          window.location.href = 'verify-otp.html?phone=' + encodeURIComponent(phone);
        }, 2000);

      } catch (error) {
        console.error('Error:', error);
        showError('Error भेजते समय आया। फिर से कोशिश करो!');
      } finally {
        setLoading(false);
      }
    }

    function contactAdmin() {
      const adminPhone = '+918484038138';
      window.open(`https://wa.me/${adminPhone.replace(/[^0-9]/g, '')}?text=Hello%20Prajapati%20Admin`, '_blank');
    }

    // Allow Enter key to send OTP
    document.getElementById('phone-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendOTP();
      }
    });

    console.log('✅ Login Page Loaded');
    console.log('✅ CONFIG Defined:', CONFIG);
    console.log('✅ Supabase Ready');
  </script>
</body>
</html>
