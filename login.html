<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #06b6d4, #fbbf24);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 15px;
      box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3);
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
    }

    .brand-highlight {
      color: #06b6d4;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
      border-left: 4px solid #dc2626;
    }

    .error.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #e5e7eb;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
      color: #6b7280;
    }

    .tab-btn.active {
      border-color: #06b6d4;
      background: #ecf9ff;
      color: #06b6d4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    input::placeholder {
      color: #d1d5db;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 15px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(30, 60, 114, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .toggle-text {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #9ca3af;
    }

    .toggle-text a {
      color: #06b6d4;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔐</div>
      <div class="brand">PRAJAPATI<span class="brand-highlight">ERP</span></div>
    </div>

    <div class="error" id="error"></div>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-section" class="form-section active">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="info@prajapati.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>

      <button onclick="loginUser()" id="login-btn">LOGIN</button>

      <div class="toggle-text">
        New user? <a onclick="switchTab('signup')">Create account</a>
      </div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signup-section" class="form-section">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Your Name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="info@prajapati.com">
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="signup-phone" placeholder="+91-8484038138">
      </div>

      <div class="form-group">
        <label>Password (min 6 chars)</label>
        <input type="password" id="signup-password" placeholder="••••••••">
      </div>

      <button onclick="signupUser()" id="signup-btn">CREATE ACCOUNT</button>

      <div class="toggle-text">
        Already have account? <a onclick="switchTab('login')">Login</a>
      </div>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://shafygjbffffjhwhmcgo.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYWZ5Z2piZmZmZmpod2htY2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDc2MjAsImV4cCI6MjA5MzQ4MzYyMH0.sygn9BEjfdht2HFdclSDnn7H5GeYqHnmPXuEnDVIafE';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    console.log('═══════════════════════════════════════════');
    console.log('✅ PRAJAPATI ERP - PRODUCTION AUTH');
    console.log('═══════════════════════════════════════════');
    console.log('Supabase Connected:', !!supabase);

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = '❌ ' + msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    function switchTab(tab) {
      // Hide all sections
      document.getElementById('login-section').classList.remove('active');
      document.getElementById('signup-section').classList.remove('active');

      // Show selected section
      if (tab === 'login') {
        document.getElementById('login-section').classList.add('active');
      } else {
        document.getElementById('signup-section').classList.add('active');
      }

      // Update tab buttons
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
      });
    }

    async function loginUser() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      if (!email || !password) {
        showError('Email और password दर्ज करो');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        console.log('🔐 Login attempt:', email);

        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        console.log('✅ Login successful!');

        // Store session
        localStorage.setItem('prajapati_session', JSON.stringify({
          user: data.user.email,
          id: data.user.id,
          token: data.session.access_token,
          time: new Date().toISOString()
        }));

        // Redirect
        window.location.href = 'dashboard.html';

      } catch (error) {
        console.error('❌ Login error:', error);
        showError(error.message || 'Login failed');
        btn.disabled = false;
        btn.textContent = 'LOGIN';
      }
    }

    async function signupUser() {
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const phone = document.getElementById('signup-phone').value.trim();
      const btn = document.getElementById('signup-btn');

      if (!name || !email || !password || !phone) {
        showError('सब fields भरो');
        return;
      }

      if (password.length < 6) {
        showError('Password कम से कम 6 characters');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        console.log('📝 Signup attempt:', email);

        // Sign up user
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password
        });

        if (error) throw error;

        console.log('✅ User created, creating profile...');

        // Create user profile
        const { error: profileError } = await supabase
          .from('user_profiles')
          .insert([{
            id: data.user.id,
            email: email,
            full_name: name,
            phone: phone,
            role: 'user'
          }]);

        if (profileError) throw profileError;

        console.log('✅ Signup complete!');
        showError('✅ Account created! अब login करो');

        // Clear form and switch to login
        setTimeout(() => {
          document.getElementById('login-email').value = email;
          document.getElementById('login-password').value = '';
          switchTab('login');
        }, 1500);

      } catch (error) {
        console.error('❌ Signup error:', error);
        showError(error.message || 'Signup failed');
        btn.disabled = false;
        btn.textContent = 'CREATE ACCOUNT';
      }
    }

    // Check if already logged in
    window.addEventListener('load', async () => {
      const session = localStorage.getItem('prajapati_session');
      if (session) {
        console.log('✅ Session found, redirecting to dashboard');
        window.location.href = 'dashboard.html';
      }
    });

    // Allow Enter key
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const loginSection = document.getElementById('login-section');
        if (loginSection.classList.contains('active')) {
          loginUser();
        } else {
          signupUser();
        }
      }
    });

    console.log('═══════════════════════════════════════════');
    console.log('✅ Login Page Ready');
    console.log('═══════════════════════════════════════════');
  </script>
</body>
</html>
