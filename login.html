<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Prajapati ERP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      color: #1f2937;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #9ca3af;
    }

    .demo-box {
      background: #f0fdf4;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 13px;
      color: #166534;
      line-height: 1.6;
    }

    .demo-box strong {
      display: block;
      margin-bottom: 8px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
      border-left: 4px solid #dc2626;
    }

    .error.show {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔐</div>
      <h1>PRAJAPATI ERP</h1>
      <p class="subtitle">Demo Login</p>
    </div>

    <div class="demo-box">
      <strong>Demo Credentials:</strong>
      Phone: +91-8484038138<br>
      Pass: admin@123
    </div>

    <div id="error" class="error"></div>

    <div class="form-group">
      <label>Phone या Username</label>
      <input 
        type="text" 
        id="username" 
        placeholder="+91-8484038138"
        value="+91-8484038138"
      >
    </div>

    <div class="form-group">
      <label>Password</label>
      <input 
        type="password" 
        id="password" 
        placeholder="admin@123"
        value="admin@123"
      >
    </div>

    <button id="btn" onclick="doLogin()">LOGIN</button>

    <div class="footer">
      Prajapati Advertising ERP v2.0
    </div>
  </div>

  <script>
    // Demo users - only local
    const USERS = {
      '+91-8484038138': 'admin@123',
      'admin': 'prajapati@123',
      'info@prajapati.com': 'password123'
    };

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('error');
      const btn = document.getElementById('btn');

      err.classList.remove('show');

      if (!u || !p) {
        err.textContent = 'Fill all fields';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Loading...';

      setTimeout(() => {
        if (USERS[u] === p) {
          // Success
          const sess = {
            user: u,
            role: 'admin',
            time: new Date().toISOString()
          };
          localStorage.setItem('prajapati_session', JSON.stringify(sess));
          window.location.href = 'dashboard.html';
        } else {
          err.textContent = 'Invalid username or password';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'LOGIN';
        }
      }, 500);
    }

    // Enter key
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
