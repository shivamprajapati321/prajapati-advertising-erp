<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · Prajapati ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: #1e40af;
      border-radius: 16px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .logo-text { font-size: 24px; font-weight: 800; color: #1f2937; }
    .logo-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; letter-spacing: 0.05em; }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-section h2 {
      font-size: 18px;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .form-section p {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .error-box {
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #dc2626;
      font-weight: 600;
      display: none;
    }

    .error-box.show {
      display: block;
    }

    .warning-box {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #92400e;
      display: none;
    }

    .warning-box.show {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1e40af;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    .otp-display {
      background: #f3f4f6;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 16px 0;
      font-family: 'Courier New', monospace;
      font-size: 32px;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: 4px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: #1e40af;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e3a8a;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(30, 64, 175, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: #1e40af;
      border: 1px solid #1e40af;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: #f0f4ff;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 16px;
    }

    .footer a {
      color: #1e40af;
      text-decoration: none;
      font-weight: 600;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .resend-timer {
      font-size: 12px;
      color: #9ca3af;
    }

    .resend-timer.ready a {
      color: #1e40af;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo-section">
    <div class="logo-icon">📦</div>
    <div class="logo-text">PRAJAPATI <span style="color: #f59e0b;">ERP</span></div>
    <div class="logo-sub">ENTERPRISE OPERATIONS SUITE</div>
  </div>

  <!-- PHONE SECTION -->
  <div class="form-section active" id="phone-section">
    <h2>Welcome back 👋</h2>
    <p>WhatsApp number daalo, OTP bhejenge</p>
    
    <div class="error-box" id="phone-error"></div>

    <div class="form-group">
      <label>WhatsApp Number</label>
      <input type="tel" id="phone-input" placeholder="+91 XXXXXXXXXX" value="+91 8484038138">
    </div>

    <button class="btn btn-primary" id="send-otp-btn" onclick="sendOTP()">
      <span id="send-otp-text">📱 Send OTP</span>
    </button>

    <div class="footer">
      Issues with login? <a href="#" onclick="alert('Contact: support@prajapati.com')">Contact admin</a>
    </div>
  </div>

  <!-- OTP SECTION -->
  <div class="form-section" id="otp-section">
    <h2>Enter OTP 🔐</h2>
    <p id="otp-phone-display">WhatsApp pe 6-digit code bheja hai</p>
    
    <div class="error-box" id="otp-error"></div>
    <div class="warning-box" id="otp-warning">
      💡 Wati delivery issue · Dev OTP: <span id="dev-otp">loading...</span>
    </div>

    <div class="form-group">
      <label>6-Digit OTP</label>
      <input type="text" id="otp-input" placeholder="000000" maxlength="6" inputmode="numeric">
    </div>

    <div class="otp-display" id="otp-display">
      <span id="otp-value">------</span>
    </div>

    <button class="btn btn-primary" id="verify-btn" onclick="verifyOTP()">
      Verify & Login
    </button>

    <button class="btn btn-secondary" onclick="changeNumber()">
      ← Change number
    </button>

    <div class="footer">
      <span id="resend-timer" class="resend-timer">
        Resend OTP <span id="timer">60</span>s
      </span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib-config.js"></script>
<script src="lib-auth.js"></script>

<script>
let resendCountdown = 0;

// Real-time OTP input display
document.getElementById('otp-input').addEventListener('input', function(e) {
  const val = this.value.padEnd(6, '-').slice(0, 6);
  document.getElementById('otp-value').textContent = val;
});

async function sendOTP() {
  const phone = document.getElementById('phone-input').value;
  const phoneError = document.getElementById('phone-error');
  const btn = document.getElementById('send-otp-btn');

  phoneError.textContent = '';
  phoneError.classList.remove('show');

  if (!phone || phone.length < 10) {
    phoneError.textContent = '❌ Valid phone number daalo';
    phoneError.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sending...';

  try {
    console.log('🚀 sendOTP() called');
    const result = await AUTH.sendOTP(phone);
    console.log('✅ sendOTP result:', result);

    // Show OTP section
    document.getElementById('phone-section').classList.remove('active');
    document.getElementById('otp-section').classList.add('active');
    document.getElementById('otp-phone-display').textContent = `WhatsApp number daalo, OTP bheja hai ${phone}`;
    
    // Show dev OTP
    const devOtp = sessionStorage.getItem('pending_otp');
    console.log('📦 Dev OTP from sessionStorage:', devOtp);
    document.getElementById('dev-otp').textContent = devOtp || 'NOT SET';
    document.getElementById('otp-warning').classList.add('show');

    // Start resend timer
    startResendTimer();

  } catch (error) {
    console.error('❌ sendOTP error:', error);
    phoneError.textContent = '❌ ' + error.message;
    phoneError.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📱 Send OTP';
  }
}

async function verifyOTP() {
  const phone = document.getElementById('phone-input').value;
  const otp = document.getElementById('otp-input').value;
  const otpError = document.getElementById('otp-error');
  const btn = document.getElementById('verify-btn');

  otpError.textContent = '';
  otpError.classList.remove('show');

  if (!otp || otp.length !== 6) {
    otpError.textContent = '❌ 6-digit OTP daalo';
    otpError.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verifying...';

  try {
    console.log('🔐 verifyOTP() called with:', otp);
    const session = await AUTH.verifyOTP(phone, otp);
    console.log('✅ Login successful:', session);
    
    // Redirect to dashboard
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 500);

  } catch (error) {
    console.error('❌ verifyOTP error:', error);
    otpError.textContent = '❌ ' + error.message;
    otpError.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Verify & Login';
  }
}

function changeNumber() {
  document.getElementById('phone-section').classList.add('active');
  document.getElementById('otp-section').classList.remove('active');
  document.getElementById('otp-input').value = '';
  document.getElementById('otp-value').textContent = '------';
}

function startResendTimer() {
  resendCountdown = 60;
  const timerEl = document.getElementById('timer');
  const interval = setInterval(() => {
    resendCountdown--;
    timerEl.textContent = resendCountdown;
    if (resendCountdown <= 0) {
      clearInterval(interval);
      document.getElementById('resend-timer').classList.add('ready');
    }
  }, 1000);
}

// Auto-populate dev OTP for testing
window.addEventListener('load', function() {
  const devOtp = sessionStorage.getItem('pending_otp');
  console.log('🔄 Page loaded, dev OTP:', devOtp);
  if (devOtp) {
    document.getElementById('dev-otp').textContent = devOtp;
  }
});
</script>

</body>
</html>
